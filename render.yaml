# Deploy do servidor de salas cooperativas no Render.
#
# O mesmo processo serve o jogo (HTTP) e as salas (WebSocket) na mesma porta,
# então o endereço do Render já joga online sozinho: não precisa preencher
# "servidor de salas" na tela da sala quando o jogo é aberto por ele.
#
# Como usar: Render → New → Blueprint → aponte para este repositório.
# O plano gratuito hiberna depois de 15 minutos parado; a primeira sala depois
# da soneca demora uns 50 segundos para abrir.
services:
  - type: web
    name: sniper-salas
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: node servidor/salas.js
    healthCheckPath: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
